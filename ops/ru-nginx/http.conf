# Bootstrap HTTP vhost, replaced by https.conf after certificate issuance.
log_format omoba_web '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time';
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/omoba-ru.access.log omoba_web;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name omoba.ru www.omoba.ru;
    server_tokens off;
    access_log /var/log/nginx/omoba-ru.access.log omoba_web;
    error_log /var/log/nginx/omoba-ru.error.log warn;
    client_max_body_size 1m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host omoba.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
